name: f1_tracker
description: Unofficial personal Formula 1 calendar, news and session analysis app.
publish_to: "none"
version: 1.6.4+1

environment:
  sdk: ">=3.14.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.2
  material_ui: ^1.0.0
  http: ^1.2.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3
  xml: ^6.5.0
  url_launcher: ^6.3.0
  window_manager: ^0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
