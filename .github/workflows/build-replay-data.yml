name: Build Replay Data

# OpenF1 ile bitmiş yarışların replay verisini üretir ve data/replay/ altına commit'ler.
# data/** değişiklikleri build-mobile.yml'i tetiklemez (orada yalnızca lib/**, pubspec.*, android/**, ios/** var).

on:
  schedule:
    # Pazar ve Pazartesi her 3 saatte bir (UTC). Veri yarıştan 30-120 dk sonra yayınlanır;
    # henüz hazır değilse betik uyarı verip bir sonraki çalışmada yeniden dener.
    - cron: "15 */3 * * 0,1"
  workflow_dispatch:
    inputs:
      year:
        description: "Sezon (boş bırakırsan bitmiş, işlenmemiş yarışlar işlenir)"
        required: false
        type: string
      round:
        description: "Yarış numarası (sezon ile birlikte)"
        required: false
        type: string
      session:
        description: "Seans: R (yarış) veya S (sprint)"
        required: false
        default: "R"
        type: string

permissions:
  contents: write

concurrency:
  group: replay-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tool/replay/requirements.txt

      - name: Install dependencies
        run: pip install -r tool/replay/requirements.txt

      - name: Unit tests (no network)
        run: python -m unittest discover -s tool/replay -p "test_*.py" -v

      - name: Build replay data
        env:
          IN_YEAR: ${{ github.event.inputs.year }}
          IN_ROUND: ${{ github.event.inputs.round }}
          IN_SESSION: ${{ github.event.inputs.session }}
        run: |
          if [ -n "$IN_YEAR" ] && [ -n "$IN_ROUND" ]; then
            python tool/replay/build_replay.py --year "$IN_YEAR" --round "$IN_ROUND" --session "${IN_SESSION:-R}"
          else
            python tool/replay/build_replay.py --latest
          fi

      - name: Commit data
        run: |
          git config user.name "replay-bot"
          git config user.email "replay-bot@users.noreply.github.com"
          git add data/replay
          if git diff --cached --quiet; then
            echo "Yeni veri yok."
          else
            git commit -m "Update replay data"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
