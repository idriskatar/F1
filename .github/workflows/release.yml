name: F1 Tracker Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  VERSION: 1.6.2

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner if absent
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            flutter create --project-name f1_tracker --org com.idriskatar --platforms=windows .
          }
      - name: Set installed app name
        run: python tool/configure_app_name.py
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows build
        shell: pwsh
        run: |
          $dir = if (Test-Path build/windows/x64/runner/Release) {
            'build/windows/x64/runner/Release'
          } else {
            'build/windows/runner/Release'
          }
          Compress-Archive -Path "$dir/*" -DestinationPath "F1-Tracker-Windows-v${{ env.VERSION }}.zip"
      - name: Build Windows installer (NSIS)
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $dir = if (Test-Path build/windows/x64/runner/Release) {
            'build/windows/x64/runner/Release'
          } else {
            'build/windows/runner/Release'
          }
          New-Item -ItemType Directory -Path installer\app -Force | Out-Null
          Copy-Item -Path "$dir\*" -Destination installer\app -Recurse -Force
          Copy-Item -Path tool\installer\windows\installer.nsi -Destination installer\ -Force
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { $makensis = "$env:ProgramFiles\NSIS\makensis.exe" }
          Push-Location installer
          & $makensis installer.nsi
          Pop-Location
          Move-Item "installer\F1-Tracker-Setup-v${{ env.VERSION }}.exe" . -Force
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: |
            F1-Tracker-Windows-v${{ env.VERSION }}.zip
            F1-Tracker-Setup-v${{ env.VERSION }}.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Linux runner if absent
        run: |
          if [ ! -d linux ]; then
            flutter create --project-name f1_tracker --org com.idriskatar --platforms=linux .
          fi
      - name: Set installed app name
        run: python3 tool/configure_app_name.py
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux build
        run: tar -czf "F1-Tracker-Linux-v${VERSION}.tar.gz" -C build/linux/x64/release bundle
      - name: Build Linux .deb installer
        run: |
          chmod +x tool/installer/linux/build_deb.sh
          tool/installer/linux/build_deb.sh build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: |
            F1-Tracker-Linux-v${{ env.VERSION }}.tar.gz
            f1-tracker_${{ env.VERSION }}_amd64.deb
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate macOS runner if absent
        run: |
          if [ ! -d macos ]; then
            flutter create --project-name f1_tracker --org com.idriskatar --platforms=macos .
          fi
      - name: Set installed app name
        run: python3 tool/configure_app_name.py
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS build
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "Flutter did not produce a .app bundle"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "F1-Tracker-macOS-v${VERSION}.zip"
      - name: Build macOS .dmg installer
        run: |
          chmod +x tool/installer/macos/build_dmg.sh
          tool/installer/macos/build_dmg.sh
      - uses: actions/upload-artifact@v6
        with:
          name: macos
          path: |
            F1-Tracker-macOS-v${{ env.VERSION }}.zip
            F1-Tracker-v${{ env.VERSION }}.dmg
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS runners if absent
        run: |
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --project-name f1_tracker --platforms=android,ios .
          fi
      - name: Set installed app name
        run: python3 tool/configure_app_name.py
      - name: Configure Android network access
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          content = path.read_text()
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in content:
              content = content.replace('<application', f'{permission}\n    <application', 1)
          path.write_text(content)
          PY
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v6
        with:
          name: android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mv artifacts/windows/*.zip "F1-Tracker-Windows-v${VERSION}.zip"
          mv artifacts/windows/*.exe "F1-Tracker-Setup-v${VERSION}.exe"
          mv artifacts/linux/*.tar.gz "F1-Tracker-Linux-v${VERSION}.tar.gz"
          mv artifacts/linux/*.deb "f1-tracker_${VERSION}_amd64.deb"
          mv artifacts/macos/*.zip "F1-Tracker-macOS-v${VERSION}.zip"
          mv artifacts/macos/*.dmg "F1-Tracker-v${VERSION}.dmg"
          mv artifacts/android/*.apk "F1-Tracker-Android-v${VERSION}.apk"
          ls -lh F1-Tracker-* f1-tracker_*.deb
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: F1 Tracker v${{ env.VERSION }}
          body_path: CHANGELOG.md
          generate_release_notes: true
          files: |
            F1-Tracker-Windows-v${{ env.VERSION }}.zip
            F1-Tracker-Setup-v${{ env.VERSION }}.exe
            F1-Tracker-Linux-v${{ env.VERSION }}.tar.gz
            f1-tracker_${{ env.VERSION }}_amd64.deb
            F1-Tracker-macOS-v${{ env.VERSION }}.zip
            F1-Tracker-v${{ env.VERSION }}.dmg
            F1-Tracker-Android-v${{ env.VERSION }}.apk
