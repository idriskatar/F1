name: F1 Tracker Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.*'
      - 'windows/**'
      - 'linux/**'
      - 'macos/**'
      - 'tool/configure_app_name.py'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  windows:
    name: Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner if absent
        shell: pwsh
        run: |
          if (-not (Test-Path windows)) {
            flutter create --project-name f1_tracker --org com.idriskatar --platforms=windows .
          }
      - name: Set installed app name
        run: python tool/configure_app_name.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Package Windows build
        shell: pwsh
        run: |
          $dir = if (Test-Path build/windows/x64/runner/Release) {
            'build/windows/x64/runner/Release'
          } else {
            'build/windows/runner/Release'
          }
          Compress-Archive -Path "$dir/*" -DestinationPath f1-tracker-windows.zip
      - uses: actions/upload-artifact@v6
        with:
          name: f1-tracker-windows
          path: f1-tracker-windows.zip
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Linux runner if absent
        run: |
          if [ ! -d linux ]; then
            flutter create --project-name f1_tracker --org com.idriskatar --platforms=linux .
          fi
      - name: Set installed app name
        run: python3 tool/configure_app_name.py
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux build
        run: tar -czf f1-tracker-linux.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v6
        with:
          name: f1-tracker-linux
          path: f1-tracker-linux.tar.gz
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate macOS runner if absent
        run: |
          if [ ! -d macos ]; then
            flutter create --project-name f1_tracker --org com.idriskatar --platforms=macos .
          fi
      - name: Set installed app name
        run: python3 tool/configure_app_name.py
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS build
        run: |
          app_path="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "Flutter did not produce a .app bundle"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$GITHUB_WORKSPACE/f1-tracker-macos.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: f1-tracker-macos
          path: f1-tracker-macos.zip
          if-no-files-found: error
          retention-days: 14
